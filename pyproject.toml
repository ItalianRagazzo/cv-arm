
[project]
name = "simple-cv-arm"
version = "0.2.0"
description = "Simple webcam to DOFBOT arm control using MediaPipe"
authors = [
    {name = "Nathan DiGilio"},
    {name = "Nick Yaple"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
    "mediapipe>=0.10.0",
    "pyserial>=3.5",
    "numpy>=1.20.0",
    "rtmlib>=0.0.13",
    "onnxruntime-gpu>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
cv-arm = "cv_arm:main"
cv-arm-rt = "cv_arm_rtmlib:main"
arm-test = "arm_test:test_arm"

[tool.setuptools]
py-modules = ["cv_arm", "cv_arm_rtmlib", "arm_test"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
